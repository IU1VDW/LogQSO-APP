name: Compila APK

# Nessun filtro sul ramo: parte su qualsiasi push, e si puo' lanciare a mano.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Trova la cartella del progetto
        id: proj
        run: |
          FILE=$(find . -name settings.gradle.kts -not -path "*/build/*" | head -1)
          if [ -z "$FILE" ]; then
            echo "::error::settings.gradle.kts non trovato: nel repository mancano i file del progetto."
            find . -path ./.git -prune -o -type f -print | head -50
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Progetto trovato in: $DIR"
          ls -la "$DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # L'SDK Android e' gia' presente sui runner di GitHub: si usa quello.
      # (L'action android-actions/setup-android@v3 fallisce perche' cerca di
      # installare il pacchetto "tools", che Google ha ritirato.)
      - name: Componenti dell'SDK Android
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          if [ -z "$SDKMGR" ]; then
            echo "::error::sdkmanager non trovato in $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "Uso: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Versioni in uso
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Compila (debug)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Raccogli l'APK
        run: |
          APK=$(find . -path "*outputs*" -name "*debug*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::La compilazione non ha prodotto nessun APK."
            exit 1
          fi
          mkdir -p out
          cp "$APK" out/LogQSO.apk
          ls -lh out/

      - name: Pubblica l'APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogQSO-apk
          path: out/LogQSO.apk
          if-no-files-found: error

      # Con un tag (git tag v1.2 && git push --tags) l'APK finisce
      # anche in una Release, scaricabile direttamente dal telefono.
      - name: Release (solo sui tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/LogQSO.apk
